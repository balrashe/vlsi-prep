<!doctype html>
<html lang="en" data-resolution="portrait">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<title>jobs3d-v2</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.181.2/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.181.2/examples/jsm/" } }
</script>
<style>
@font-face { font-family: "Inter"; src: url("assets/fonts/Inter.woff2") format("woff2"); font-weight: 100 900; }
@font-face { font-family: "JetBrains Mono"; src: url("assets/fonts/JetBrainsMono.woff2") format("woff2"); font-weight: 100 800; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0d0b0a; }
#root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
#gl { position: absolute; inset: 0; width: 1080px; height: 1920px; }
.cap { position: absolute; left: 80px; right: 80px; top: 300px; text-align: center; font: 900 86px/1.1 "Inter";
  letter-spacing: -0.025em; text-transform: uppercase; color: #fff; opacity: 0;
  text-shadow: 0 4px 22px rgba(0,0,0,.55); }
.cap .w { display: inline-block; opacity: 0; margin: 0 0.1em; }
.cap .k { background: #e3262f; padding: 0.02em 0.18em; border-radius: 12px; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="30" data-width="1080" data-height="1920" data-fps="30">
  <canvas id="gl" width="1080" height="1920"></canvas>
  <div id="caps"></div>
</div>
<script>
// One beat clock for the captions (GSAP) and the 3D scene (hf-seek). Seconds.
window.BEATS = [[0, 5], [5, 8], [8, 11.5], [11.5, 16.5], [16.5, 20], [20, 23.5], [23.5, 27], [27, 30]];
// [start, end, words]: words wrapped in * get the red box
const CAPS = [
  [0.2, 2.2, "69 *applications.*"], [2.2, 3.6, "20 *interviews.*"], [3.6, 5, "1 *job.*"],
  [5.1, 6.5, "his job got *cut.*"], [6.5, 8, "so he built an *AI agent.*"],
  [8.1, 9.8, "feed it your *CV.*"], [9.8, 11.5, "it learns your *profile.*"],
  [11.6, 16.5, "it *scrapes* the job boards."],
  [16.6, 18.3, "scores *every* post"], [18.3, 20, "against *you.*"],
  [20.1, 21.8, "tailors your *CV*"], [21.8, 23.5, "+ a *cover letter.*"],
  [23.6, 27, "then a *mock interview.*"],
  [27.1, 30, "comment *JOBS*"],
];
function build() {
  const caps = document.getElementById("caps");
  CAPS.forEach(([a, b, txt]) => {
    const d = document.createElement("div");
    d.className = "cap";
    d.innerHTML = txt.split(" ").map((w) => /\*/.test(w) ? `<span class="w k">${w.replace(/\*/g, "")}</span>` : `<span class="w">${w}</span>`).join(" ");
    d.dataset.a = a; d.dataset.b = b;
    caps.appendChild(d);
  });
  const tl = gsap.timeline({ paused: true });
  document.querySelectorAll(".cap").forEach((d) => {
    const a = +d.dataset.a, b = +d.dataset.b;
    tl.set(d, { opacity: 1 }, a).set(d, { opacity: 0 }, b);
    d.querySelectorAll(".w").forEach((w, k) => {
      tl.fromTo(w, { opacity: 0, scale: 0.7, y: 14 }, { opacity: 1, scale: 1, y: 0, duration: 0.22, ease: "back.out(2.2)" }, a + k * 0.07);
    });
  });
  tl.set({}, {}, 30);
  window.__timelines["main"] = tl;
}
document.fonts.ready.then(build);
</script>
<script type="module">
// Clean studio dioramas around Claude's mascot. Every frame is a pure function of HyperFrames time (hf-seek).
import * as THREE from "three";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { FontLoader } from "three/addons/loaders/FontLoader.js";
import { TextGeometry } from "three/addons/geometries/TextGeometry.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";

const W = 1080, H = 1920, B = window.BEATS;
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("gl"), antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H, false); renderer.setPixelRatio(1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 0.92;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.32;
const camera = new THREE.PerspectiveCamera(38, W / H, 0.1, 400);
const composer = new EffectComposer(renderer);
composer.setSize(W, H);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(W / 2, H / 2), 0.22, 0.5, 0.98));
composer.addPass(new OutputPass());

// ---- math -----------------------------------------------------------------------------------------
const rnd = (i) => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const io = (x) => { x = clamp(x); return x < 0.5 ? 4 * x * x * x : 1 - (-2 * x + 2) ** 3 / 2; };
const ss = (a, b, x) => io((x - a) / (b - a));
const back = (x) => { x = clamp(x); const c = 1.7; return 1 + (c + 1) * (x - 1) ** 3 + c * (x - 1) ** 2; };
const vlerp = (a, b, k) => a.map((v, i) => lerp(v, b[i], k));

// ---- materials and builders --------------------------------------------------------------------------
const phys = (color, o = {}) => new THREE.MeshPhysicalMaterial({ color, roughness: 0.42, clearcoat: 0.6, clearcoatRoughness: 0.25, ...o });
const matte = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.75, ...o });
function rbox(w, h, d, r, m, seg = 4) {
  const mesh = new THREE.Mesh(new RoundedBoxGeometry(w, h, d, seg, Math.min(r, w / 2, h / 2, d / 2)), m);
  mesh.castShadow = true; mesh.receiveShadow = true; return mesh;
}
function tex(w, h, draw) {
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const g = c.getContext("2d"); draw(g, w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  t.userData = { c, g, draw }; return t;
}
function rr(g, x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }
// a rounded panel with a texture on its front face only
function panel(w, h, d, t, frame = 0x1d1b22, o = {}) {
  const g = new THREE.Group();
  g.add(rbox(w, h, d, Math.min(0.35, d / 2), phys(frame, { roughness: 0.35 })));
  const face = new THREE.Mesh(new THREE.PlaneGeometry(w - 0.3, h - 0.3), new THREE.MeshStandardMaterial({ map: t, roughness: 0.5, emissive: 0xffffff, emissiveMap: t, emissiveIntensity: o.glow ?? 0.55, transparent: !!o.alpha }));
  face.material.color.setScalar(o.tint ?? 0.86); face.position.z = d / 2 + 0.01; g.add(face); g.userData.face = face; return g;
}

// ---- stage: seamless studio floor + backdrop, soft key light ---------------------------------------
const bgTex = tex(4, 512, () => {});
function setBackdrop(top, bottom) {
  const { g, c } = bgTex.userData; const gr = g.createLinearGradient(0, 0, 0, c.height);
  gr.addColorStop(0, top); gr.addColorStop(0.62, bottom); gr.addColorStop(1, bottom);
  g.fillStyle = gr; g.fillRect(0, 0, c.width, c.height); bgTex.needsUpdate = true;
}
scene.background = bgTex;
scene.fog = new THREE.Fog(0x120f0d, 45, 120);
const floorMat = new THREE.MeshStandardMaterial({ color: 0x1a1613, roughness: 0.92 });
const floor = new THREE.Mesh(new THREE.CircleGeometry(160, 96), floorMat);
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
const key = new THREE.DirectionalLight(0xfff1e2, 1.8); key.position.set(10, 26, 16);
key.castShadow = true; key.shadow.mapSize.set(2048, 2048); key.shadow.bias = -0.0004; key.shadow.normalBias = 0.03;
Object.assign(key.shadow.camera, { left: -26, right: 26, top: 26, bottom: -26, near: 1, far: 80 }); key.shadow.radius = 4;
scene.add(key, key.target);
const pool = new THREE.SpotLight(0xffe2c4, 340, 70, 0.62, 1, 1.8); pool.position.set(0, 34, 6); scene.add(pool, pool.target);
const rim = new THREE.PointLight(0xff7a3d, 260, 60, 1.6); rim.position.set(-12, 12, -10); scene.add(rim);
scene.add(new THREE.HemisphereLight(0xcfd6ff, 0x1a120c, 0.35));

// ---- landing ripples: thin rings that spread on the floor and fade ---------------------------------
const ringGeo = new THREE.RingGeometry(0.94, 1, 96);
const ripples = Array.from({ length: 6 }, () => {
  const m = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({ color: 0xffe6d0, transparent: true, depthWrite: false, toneMapped: false }));
  m.rotation.x = -Math.PI / 2; m.visible = false; scene.add(m); return m;
});
// events: [[time, x, z, color?]] in beat time; two rings per landing, the second slightly late
function drawRipples(events, u, color = 0xffd9bf) {
  let n = 0;
  ripples.forEach((r) => (r.visible = false));
  events.forEach(([t0, x, z, c]) => [0, 0.12].forEach((lag, j) => {
    const k = (u - t0 - lag) / 0.75;
    if (k <= 0 || k >= 1 || n >= ripples.length) return;
    const r = ripples[n++]; r.visible = true;
    r.position.set(x, 0.02 + j * 0.005, z); r.scale.setScalar(1.2 + io(k) * (j ? 4.5 : 6.5));
    r.material.color.setHex(c || color); r.material.opacity = (1 - k) * (j ? 0.5 : 0.85);
  }));
}

// ---- Claude's mascot, rounded and glossy -----------------------------------------------------------------
const ORANGE = 0xd97757;
function makeClawd(scale = 1) {
  const root = new THREE.Group(), body = new THREE.Group(); root.add(body);
  const mat = phys(ORANGE, { roughness: 0.38, clearcoat: 0.8, emissive: ORANGE, emissiveIntensity: 0 });
  const eyeMat = phys(0x15110f, { roughness: 0.15, clearcoat: 1 });
  const torso = rbox(6, 3.6, 3, 0.55, mat, 5); torso.position.y = 3.3; body.add(torso);
  const eyes = [-1.3, 1.3].map((x) => { const e = rbox(0.58, 1.15, 0.3, 0.14, eyeMat); e.position.set(x, 3.7, 1.42); body.add(e); return e; });
  const arms = [-1, 1].map((s) => { const p = new THREE.Group(); p.position.set(s * 2.9, 3.05, 0); const a = rbox(1.35, 1.05, 1.25, 0.32, mat); a.position.x = s * 0.62; p.add(a); body.add(p); return p; });
  const legs = [-2.2, -0.75, 0.75, 2.2].map((x) => { const l = rbox(0.9, 1.6, 1.15, 0.28, mat); l.position.set(x, 0.8, 0); body.add(l); return l; });
  root.scale.setScalar(scale); scene.add(root);
  return { root, body, torso, eyes, arms, legs, mat };
}
// jumps: [[t0, height, airtime]] in beat time; returns lift and squash (positive = squashed)
function jumpState(jumps, u) {
  let y = 0, sq = 0;
  jumps.forEach(([t0, h, air]) => {
    const a = u - t0;
    if (a > -0.16 && a <= 0) sq += 0.55 * Math.sin(Math.PI * (a + 0.16) / 0.16);            // crouch
    if (a > 0 && a < air) { const k = a / air; y += h * 4 * k * (1 - k); sq -= 0.28 * (1 - Math.min(1, k * 2.2)); }
    if (a >= air && a < air + 0.42) { const k = (a - air) / 0.42; sq += 0.7 * Math.exp(-5 * k) * Math.cos(k * 9); }
  });
  return { y, sq };
}
function poseClawd(C, t, o) {
  const { y, sq } = jumpState(o.jumps || [], o.u ?? 0);
  const walk = o.walk || 0, ph = (o.phase ?? t) * 11;
  C.root.position.set(o.p[0], o.p[1] + y + walk * Math.abs(Math.sin(ph)) * 0.25, o.p[2]);
  C.root.rotation.y = o.ry || 0;
  C.body.scale.set(1 + sq * 0.16, 1 - sq * 0.22, 1 + sq * 0.16);
  C.body.rotation.x = (o.look || 0) + 0.025 * Math.sin(t * 2.1);
  C.body.rotation.z = (o.tilt || 0) + 0.02 * Math.sin(t * 1.6) + walk * 0.06 * Math.sin(ph);
  C.torso.position.y = 3.3 + 0.08 * Math.sin(t * 3.4);
  const bl = ((t + (o.blinkOff || 0)) * 1000) % 3300 < 120 ? 0.1 : 1;
  C.eyes.forEach((e) => (e.scale.y = bl));
  C.arms[0].rotation.z = (o.armL || 0) + 0.25 * Math.sin(t * 7) * (o.tap || 0) + walk * 0.35 * Math.sin(ph);
  C.arms[1].rotation.z = -(o.wave ? 2.0 + 0.45 * Math.sin(t * 13) : 0) - (o.armR || 0) - 0.25 * Math.sin(t * 7 + 1.4) * (o.tap || 0) - walk * 0.35 * Math.sin(ph);
  C.legs.forEach((l, i) => (l.position.y = 0.8 + Math.max(0, Math.sin(ph + (i % 2) * Math.PI)) * 0.55 * walk));
  C.mat.emissiveIntensity = o.glow || 0;
}
const clawd = makeClawd();

// ---- 3D type -----------------------------------------------------------------------------------------
let FONT;
function text3d(str, size, m, depth = size * 0.28) {
  const geo = new TextGeometry(str, { font: FONT, size, depth, curveSegments: 10, bevelEnabled: true, bevelThickness: size * 0.05, bevelSize: size * 0.035, bevelSegments: 6 });
  geo.computeBoundingBox(); const bb = geo.boundingBox;
  geo.translate(-(bb.max.x + bb.min.x) / 2, -bb.min.y, -(bb.max.z + bb.min.z) / 2);
  const mesh = new THREE.Mesh(geo, m); mesh.castShadow = true; mesh.receiveShadow = true; return mesh;
}

// ---- shared textures -------------------------------------------------------------------------------------
const paperTex = tex(512, 680, (g, w, h) => {
  g.fillStyle = "#f7f4ee"; g.fillRect(0, 0, w, h);
  g.fillStyle = "#1c1c1c"; g.font = "800 34px Inter"; g.fillText("Application", 40, 70);
  g.fillStyle = "#e3262f"; g.fillRect(40, 92, 70, 6);
  g.fillStyle = "#cfcabf"; for (let y = 140; y < h - 40; y += 34) g.fillRect(40, y, 260 + ((y * 37) % 150), 11);
});
function docTex(head, sub, accent) {
  return tex(800, 1040, (g, w, h) => {
    g.fillStyle = "#f7f4ee"; g.fillRect(0, 0, w, h);
    g.fillStyle = accent; g.fillRect(0, 0, w, 170);
    g.fillStyle = "#fff"; g.font = "900 110px Inter"; g.fillText(head, 56, 130);
    g.fillStyle = "#1c1c1c"; g.font = "800 44px Inter"; g.fillText(sub, 56, 260);
    g.fillStyle = "#d3cec3"; for (let y = 320; y < h - 50; y += 62) g.fillRect(56, y, 360 + ((y * 53) % 300), 20);
  });
}
const TITLES = ["Data Scientist", "ML Engineer", "Geophysicist", "AI Engineer", "Data Analyst", "Python Developer", "GIS Analyst", "Research Engineer"];
const cardTexes = TITLES.map((title, i) => tex(640, 400, (g, w, h) => {
  g.fillStyle = "#fbfaf7"; g.fillRect(0, 0, w, h);
  rr(g, 36, 36, 84, 84, 20); g.fillStyle = ["#2ab397", "#e3a21a", "#7a5cff", "#e8622c"][i % 4]; g.fill();
  g.fillStyle = "#8a857c"; g.font = "700 30px Inter"; g.fillText("Job post", 144, 70);
  g.fillStyle = "#151515"; g.font = "900 46px Inter"; g.fillText(title, 144, 116);
  g.fillStyle = "#dcd7cd"; [0, 1, 2].forEach((k) => { rr(g, 36, 190 + k * 54, 520 - k * 120, 20, 10); g.fill(); });
}));
const cardGeo = new RoundedBoxGeometry(5.2, 3.25, 0.18, 3, 0.09);
const cardSide = phys(0xf2efe9, { roughness: 0.5, clearcoat: 0.2 });
const cardFronts = cardTexes.map((t) => new THREE.MeshStandardMaterial({ map: t, roughness: 0.55 }));
function jobCard(i) {
  const g = new THREE.Group();
  const b = new THREE.Mesh(cardGeo, cardSide); b.castShadow = true; g.add(b);
  const f = new THREE.Mesh(new THREE.PlaneGeometry(5.0, 3.05), cardFronts[i % 8].clone()); f.position.z = 0.1; g.add(f);
  g.userData.front = f; return g;
}
function bubbleTex(text) {
  return tex(1100, 300, (g, w, h) => {
    g.shadowColor = "rgba(0,0,0,0.25)"; g.shadowBlur = 24;
    rr(g, 20, 20, w - 40, h - 90, 60); g.fillStyle = "#ffffff"; g.fill();
    g.beginPath(); g.moveTo(w / 2 - 34, h - 72); g.lineTo(w / 2, h - 22); g.lineTo(w / 2 + 34, h - 72); g.fill();
    g.shadowBlur = 0; g.fillStyle = "#141414"; g.font = "800 74px Inter"; g.textAlign = "center"; g.fillText(text, w / 2, 150);
  });
}
function bubble(text, w = 8.8) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, w * 300 / 1100), new THREE.MeshBasicMaterial({ map: bubbleTex(text), transparent: true, toneMapped: false, color: 0xe8e8e8 }));
  return m;
}

// ---- sets --------------------------------------------------------------------------------------------------
const sets = [];
function makeSet(look, setup, update, cams) { const g = new THREE.Group(); scene.add(g); const s = { g, look, cams, update }; setup(g, s); sets.push(s); }
// look: [backdrop top, backdrop bottom, rim colour]
const WARM = ["#2a211c", "#120f0d", 0xff7a3d];

function buildSets() {
  // 0: 69 papers rain down, the count drops 69 -> 20 -> 1
  makeSet(WARM, (g, s) => {
    s.papers = [];
    const pg = new THREE.PlaneGeometry(2.3, 3.05, 6, 8);
    const pos = pg.attributes.position; for (let i = 0; i < pos.count; i++) pos.setZ(i, 0.12 * Math.sin(pos.getX(i) * 1.2) + 0.05 * pos.getY(i) ** 2 * 0.1);
    pg.computeVertexNormals();
    const pm = new THREE.MeshStandardMaterial({ map: paperTex, side: THREE.DoubleSide, roughness: 0.85, color: 0xd6d1c8 });
    for (let i = 0; i < 69; i++) {
      const m = new THREE.Mesh(pg, pm); m.castShadow = true; m.receiveShadow = true; g.add(m);
      const a = rnd(i) * Math.PI * 2, r = 4.8 + rnd(i + 9) ** 0.7 * 11;
      s.papers.push({ m, x: Math.cos(a) * r, z: Math.sin(a) * r * 0.8 - 1.5, t0: 0.08 + rnd(i + 3) * 1.9, rz: rnd(i + 4) * 6.28, sway: 0.6 + rnd(i + 5) });
    }
    const white = phys(0xf4efe7, { roughness: 0.22, clearcoat: 1 });
    const gold = phys(0xf0b54a, { roughness: 0.18, metalness: 0.75, clearcoat: 1, emissive: 0x6b3d00, emissiveIntensity: 0.35 });
    s.n69 = text3d("69", 5.2, white); s.n20 = text3d("20", 5.2, white); s.n1 = text3d("1", 5.6, gold);
    [s.n69, s.n20, s.n1].forEach((m) => { m.position.set(0, 7.2, -9); g.add(m); });
  }, (s, u, t) => {
    s.papers.forEach((p, i) => {
      const k = clamp((u - p.t0) / 1.0), e = k * k;
      p.m.visible = u >= p.t0;
      const sw = Math.sin(u * 4 * p.sway + i) * (1 - k);
      p.m.position.set(p.x + sw * 1.4, lerp(30, 0.04 + (i % 7) * 0.012, e), p.z + Math.cos(u * 3 + i) * (1 - k) * 0.8);
      p.m.rotation.set(-Math.PI / 2 + sw * 0.9 * (1 - k) + (1 - k) * 0.4, 0, p.rz + (1 - k) * 1.5);
    });
    // number swaps: old one sinks and shrinks, new one rises with overshoot
    const show = (m, a, b) => { const kin = back((u - a) / 0.4), kout = io((u - b) / 0.22);
      m.visible = u > a && u < b + 0.22; m.scale.setScalar(Math.max(0.001, kin * (1 - kout))); m.rotation.y = 0.22 * Math.sin(t * 0.8); m.position.y = 7.2 + 0.25 * Math.sin(t * 1.3); };
    show(s.n69, 0.15, 2.15); show(s.n20, 2.25, 3.55); show(s.n1, 3.65, 99);
    const jumps = [[2.25, 1.1, 0.38], [3.7, 3.4, 0.62]];
    poseClawd(clawd, t, { u, p: [0, 0, 3.5], jumps, look: -0.22 * ss(0, 0.8, u) * (1 - ss(1.8, 2.2, u)), tilt: 0.06 * Math.sin(u * 2.6) * (1 - ss(1.8, 2.2, u)), wave: u > 4.35 });
    drawRipples([[2.25 + 0.38, 0, 3.5], [3.7 + 0.62, 0, 3.5, 0xffd27a]], u);
  }, [[0, [0, 12, 42], [0, 6.5, -2]], [5, [0, 8.5, 32], [0, 6, -2]]]);

  // 1: the agent at work, commands on a floating screen
  const termTex = tex(1200, 760, () => {});
  const TERM = [[0.05, "> /setup", "#9fe870"], [0.35, "  profile ready", "#9b968d"], [0.75, "> /scrape", "#9fe870"], [1.05, "  scanning job boards", "#9b968d"],
    [1.5, "> /apply", "#9fe870"], [1.8, "  tailoring CV", "#9b968d"], [2.1, "  writing cover letter", "#9b968d"], [2.45, "  application sent", "#f0b54a"]];
  function drawTerm(u) {
    const { g, c } = termTex.userData;
    g.fillStyle = "#121117"; g.fillRect(0, 0, c.width, c.height);
    g.fillStyle = "#1d1b24"; g.fillRect(0, 0, c.width, 74);
    ["#ff5f57", "#febc2e", "#28c840"].forEach((col, i) => { g.beginPath(); g.arc(44 + i * 40, 37, 12, 0, 7); g.fillStyle = col; g.fill(); });
    g.fillStyle = "#8a857c"; g.font = "700 30px Inter"; g.fillText("Claude Code · job search", 180, 48);
    g.font = "700 46px 'JetBrains Mono'";
    TERM.forEach(([tt, line, col], i) => { if (u < tt) return; const n = Math.floor(clamp((u - tt) / 0.25) * line.length);
      g.fillStyle = col; g.fillText(line.slice(0, n), 50, 150 + i * 74); });
    termTex.needsUpdate = true;
  }

function camAt(cams, u) {
  let i = 0; while (i < cams.length - 1 && u > cams[i + 1][0]) i++;
  const a = cams[i], b = cams[Math.min(i + 1, cams.length - 1)];
  const k = b === a ? 0 : io((u - a[0]) / (b[0] - a[0]));
  return [vlerp(a[1], b[1], k), vlerp(a[2], b[2], k)];
}
function renderAt(t) {
  let i = B.findIndex(([a, b]) => t >= a && t < b); if (i < 0) i = B.length - 1;
  const u = t - B[i][0], s = sets[i];
  sets.forEach((x, k) => (x.g.visible = k === i));

  scene.fog.color.set(s.look[1]); floorMat.color.set(s.look[1]).offsetHSL(0, 0, 0.035);
  s.update(s, u, t);
  let p, l;
  if (s.cams) [p, l] = camAt(s.cams, u);
  else { const f = s.camFollow; p = [f[0] * 0.55, 10.5, 30 + f[2] * 0.3]; l = [f[0] * 0.75, 5.5, f[2] * 0.5 - 1]; }
  camera.position.set(p[0] + Math.sin(t * 0.6) * 0.12, p[1] + Math.sin(t * 0.8) * 0.08, p[2]);
  camera.lookAt(l[0], l[1], l[2]);
  pool.target.position.set(l[0], 0, l[2]); key.target.position.set(l[0], 0, l[2]);
  composer.render();
}

  renderAt(window.__hfThreeTime || 0);
})();
window.addEventListener("hf-seek", (e) => { if (sets.length) renderAt(e.detail.time); });
</script>
