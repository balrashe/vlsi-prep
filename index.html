<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>VLSI Final Prep</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="./content.js"></script>
<style>
:root{
  --bg:#f3f1eb;
  --bg-warm:#faf7f1;
  --surface:#ffffff;
  --surface-soft:#fbf9f5;
  --border:#e2ded4;
  --border-strong:#d0cbc0;
  --fg:#2a261e;
  --fg-muted:#6b665c;
  --accent:#c2563a;
  --accent-dim:#a84830;
  --accent-light:#f7ebe6;
  --green:#1d5c48;
  --green-soft:#e8f4ef;
  --red:#b91c1c;
  --red-soft:#fef2f2;
  --purple:#5b4a9e;
  --shadow-sm:0 1px 3px rgba(42,38,30,.06);
  --shadow-md:0 8px 30px rgba(42,38,30,.08);
  --shadow-card:0 2px 14px rgba(42,38,30,.07);
  --r-sm:10px;
  --r:14px;
  --r-lg:20px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-tap-highlight-color:transparent}
body{
  font-family:'DM Sans',system-ui,sans-serif;
  background:var(--bg);
  background-image:radial-gradient(ellipse 120% 80% at 50% -20%,#ebe4d8 0%,transparent 55%);
  color:var(--fg);
  -webkit-font-smoothing:antialiased;
  line-height:1.5;
  min-height:100dvh;
}
button{font:inherit;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.45}
button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.mono{font-family:'DM Mono',ui-monospace,monospace}
@keyframes fi{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes fi2{0%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:translateY(0)}}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
.fi{animation:fi .45s cubic-bezier(.22,1,.36,1) both}
.fi2{animation:fi2 .45s cubic-bezier(.22,1,.36,1) .08s both}
.pop{animation:pop .35s cubic-bezier(.34,1.2,.64,1) both}
svg text{font-family:'DM Mono',monospace}

.app-shell{max-width:440px;margin:0 auto;padding:20px 18px 32px;min-height:100dvh}

/* —— Hero & home —— */
.hero-block{
  text-align:center;
  padding:26px 18px 22px;
  margin-bottom:18px;
  background:linear-gradient(165deg,var(--surface) 0%,var(--surface-soft) 55%,var(--bg-warm) 100%);
  border:1px solid var(--border);
  border-radius:var(--r-lg);
  box-shadow:var(--shadow-card);
}
.pill-row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center}
.pill{
  font-size:11px;font-weight:600;
  padding:6px 12px;border-radius:999px;
  background:var(--surface-soft);
  border:1px solid var(--border);
  color:var(--fg-muted);
}
.pill.muted{font-weight:500;opacity:.9}
.hero-title{
  margin-top:14px;
  font-size:clamp(1.65rem,5.5vw,2rem);
  font-weight:800;
  letter-spacing:-.035em;
  line-height:1.08;
  color:var(--fg);
}
.hero-sub{font-size:14px;color:var(--fg-muted);margin-top:8px;line-height:1.45}
.footer-meta{text-align:center;margin-top:22px;font-size:11px;color:var(--fg-muted);opacity:.85}

/* —— Topic grid —— */
.topic-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.topic-card{
  width:100%;text-align:left;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--r);
  padding:16px 14px;
  display:flex;flex-direction:column;gap:8px;
  box-shadow:var(--shadow-sm);
  transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;
}
.topic-card:hover{
  transform:translateY(-3px);
  box-shadow:var(--shadow-md);
  border-color:var(--border-strong);
}
.topic-card-head{display:flex;justify-content:space-between;align-items:center}
.topic-card-title{font-weight:700;font-size:15px;letter-spacing:-.02em;line-height:1.25}
.topic-card-sub{font-size:12px;color:var(--fg-muted);line-height:1.4}
.topic-card-meta{font-size:10px;color:var(--accent);font-weight:500;margin-top:2px}

/* —— Chips —— */
.chip{
  display:inline-flex;align-items:center;
  padding:5px 10px;border-radius:999px;
  font-size:10px;font-weight:600;
  background:#ebe8e0;
  color:var(--fg-muted);
  border:1px solid transparent;
}
.chip.accent{background:var(--accent-light);color:var(--accent);border-color:rgba(194,86,58,.18)}
.chip.green{background:var(--green-soft);color:var(--green);border-color:rgba(29,92,72,.15)}

/* —— Buttons —— */
.btn{
  padding:11px 20px;border-radius:var(--r-sm);
  border:1px solid var(--border-strong);
  background:var(--surface-soft);
  color:var(--fg);
  font-weight:600;font-size:13px;
  transition:background .15s,border-color .15s,transform .1s,box-shadow .15s;
  box-shadow:var(--shadow-sm);
}
.btn:hover:not(:disabled){background:var(--surface);border-color:#c4bfb3}
.btn:active:not(:disabled){transform:scale(.98)}
.btn.primary{
  background:var(--accent);
  border-color:var(--accent-dim);
  color:#fff;
  box-shadow:0 4px 14px rgba(194,86,58,.32);
}
.btn.primary:hover:not(:disabled){background:var(--accent-dim);filter:brightness(1.02)}
.btn.muted{background:transparent;border-color:var(--border);box-shadow:none;color:var(--fg-muted)}
.btn.muted:hover:not(:disabled){background:var(--surface-soft);color:var(--fg)}
.btn.success{
  background:var(--green);
  border-color:#164a3a;
  color:#fff;
  box-shadow:0 4px 14px rgba(29,92,72,.28);
}
.back-btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:8px 4px;margin-bottom:4px;
  background:none;border:none;
  color:var(--fg-muted);
  font-weight:600;font-size:13px;
  transition:color .15s;
}
.back-btn:hover{color:var(--accent)}

/* —— Panels (learn / problem / mock) —— */
.progress-head{display:flex;justify-content:space-between;align-items:baseline;margin:10px 0 8px;gap:12px}
.progress-title{font-weight:700;font-size:15px;letter-spacing:-.02em;line-height:1.3;flex:1;min-width:0}
.progress-count{font-size:12px;color:var(--fg-muted);flex-shrink:0}
.progress-track{width:100%;height:6px;background:#e5e1d9;border-radius:99px;overflow:hidden;margin-bottom:14px}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),#d4785c);border-radius:99px;transition:width .45s cubic-bezier(.22,1,.36,1)}
.diagram-panel{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--r);
  padding:14px;
  margin-bottom:14px;
  box-shadow:var(--shadow-sm);
}
.question-panel{
  background:var(--surface-soft);
  border:1px solid var(--border);
  border-radius:var(--r-sm);
  padding:14px 16px;
  font-size:14px;
  line-height:1.55;
  color:var(--fg);
  white-space:pre-line;
  margin-bottom:14px;
}
.step-stack{display:flex;flex-direction:column;gap:10px;margin-bottom:18px}
.step-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--r-sm);
  padding:12px 14px;
  box-shadow:var(--shadow-sm);
}
.step-row{display:flex;gap:12px;align-items:flex-start}
.step-badge{
  flex-shrink:0;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-weight:700;color:#fff;
  line-height:1;
}
.step-text{font-size:14px;line-height:1.55;color:var(--fg)}
.step-src{
  margin-top:8px;font-size:10px;color:var(--fg-muted);
  background:var(--surface-soft);
  padding:4px 9px;border-radius:6px;
  display:inline-block;border:1px solid var(--border);
}
.action-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* —— Topic detail shell —— */
.sheet{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--r-lg);
  padding:20px 18px;
  box-shadow:var(--shadow-card);
  margin-top:8px;
}
.sheet-title-row{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.sheet-h1{font-size:22px;font-weight:800;letter-spacing:-.03em;line-height:1.15}
.sheet-sub{font-size:13px;color:var(--fg-muted);margin-top:6px;line-height:1.45}
.sheet-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.section-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--fg-muted);margin-bottom:10px}
.concept-row{display:flex;gap:12px;align-items:flex-start}
.concept-row+.concept-row{margin-top:10px}
.segmented{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.segmented button{
  border-radius:var(--r-sm);
  padding:12px 14px;
  font-weight:700;font-size:14px;
  cursor:pointer;
  transition:background .15s,border-color .15s,color .15s,box-shadow .15s;
}
.segmented button[aria-pressed="true"]{
  background:var(--accent-light);
  border:1px solid rgba(194,86,58,.35);
  color:var(--accent);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.6);
}
.segmented button[aria-pressed="false"]{
  background:var(--surface-soft);
  border:1px solid var(--border);
  color:var(--fg-muted);
}
.segmented button[aria-pressed="false"]:hover{background:var(--surface);color:var(--fg)}

/* —— Practice list cards —— */
.problem-card{
  width:100%;text-align:left;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--r);
  padding:16px;
  display:flex;justify-content:space-between;align-items:center;gap:14px;
  box-shadow:var(--shadow-sm);
  cursor:pointer;
  transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease;
}
.problem-card:hover{
  transform:translateY(-2px);
  box-shadow:var(--shadow-md);
  border-color:var(--border-strong);
}
.problem-row{display:flex;justify-content:space-between;align-items:center;gap:14px;width:100%}
.preview-title{font-weight:700;font-size:15px;letter-spacing:-.02em;line-height:1.25;color:var(--fg)}
.problem-copy{font-size:13px;color:var(--fg-muted);line-height:1.45;margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.problem-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chevron{color:var(--accent);font-size:22px;font-weight:300;line-height:1;opacity:.75}

/* —— Topic / problem screens (panel layout) —— */
.panel-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--r-lg);
  padding:20px 18px;
  box-shadow:var(--shadow-card);
  margin-top:10px;
}
.topic-summary{margin-top:6px}
.topic-heading{display:flex;align-items:flex-start;gap:14px;margin-bottom:14px}
.topic-title{font-size:23px;font-weight:800;letter-spacing:-.035em;line-height:1.12;color:var(--fg)}
.topic-sub{font-size:14px;color:var(--fg-muted);margin-top:6px;line-height:1.45}
.stats-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.concepts-card{
  margin-top:18px;
  padding:16px;
  background:var(--surface-soft);
  border:1px solid var(--border);
  border-radius:var(--r);
}
.concept-list{display:flex;flex-direction:column;gap:12px}
.concept-item{display:flex;gap:12px;align-items:flex-start}
.segmented .segment-btn{
  border-radius:var(--r-sm);
  padding:12px 14px;
  font-weight:700;font-size:14px;
  cursor:pointer;
  transition:background .15s,border-color .15s,color .15s,box-shadow .15s;
  background:var(--surface-soft);
  border:1px solid var(--border);
  color:var(--fg-muted);
}
.segmented .segment-btn:hover{background:var(--surface);color:var(--fg)}
.segmented .segment-btn.active{
  background:var(--accent-light);
  border-color:rgba(194,86,58,.38);
  color:var(--accent);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.65);
}
.preview-card{margin-top:14px}
.preview-card .preview-title{font-size:17px}
.preview-meta{font-size:11px;color:var(--fg-muted);margin-top:8px;line-height:1.4}
.preview-copy{font-size:14px;color:var(--fg-muted);margin-top:14px;line-height:1.55}
.preview-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-top:18px}
.practice-list{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.problem-title{font-weight:700;font-size:18px;letter-spacing:-.03em;margin-top:6px;line-height:1.2;color:var(--fg)}
.question-block{
  background:linear-gradient(180deg,var(--surface-soft) 0%,#f5f2eb 100%);
  border:1px solid var(--border);
  border-radius:var(--r);
  padding:16px 18px;
  margin-bottom:14px;
  font-size:14px;
  line-height:1.55;
  color:var(--fg);
  white-space:pre-line;
}
.question-label{
  font-size:10px;font-weight:700;letter-spacing:.1em;
  color:var(--accent);
  margin-bottom:10px;
}

/* —— Mock CTA on home —— */
.mock-cta{
  margin-bottom:14px;
  background:linear-gradient(135deg,var(--accent-light) 0%,var(--surface) 50%)!important;
  border-color:rgba(194,86,58,.28)!important;
  box-shadow:0 4px 20px rgba(194,86,58,.14)!important;
}
.mock-cta .preview-title{font-size:17px}

/* —— Mock exam hub —— */
.mock-page-title{font-size:24px;font-weight:800;letter-spacing:-.03em;margin:8px 0 6px;line-height:1.15}
.mock-lede{font-size:14px;color:var(--fg-muted);line-height:1.5;margin-bottom:16px}
.mock-section{margin-top:26px}
.mock-section-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--fg-muted);margin-bottom:12px}
.mock-empty{font-size:14px;color:var(--fg-muted);padding:12px 0}
.mock-row-list{display:flex;flex-direction:column;gap:10px}
.mock-session-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--r);
  padding:14px 16px;
  display:flex;flex-wrap:wrap;gap:12px;
  align-items:center;justify-content:space-between;
  box-shadow:var(--shadow-sm);
}
.mock-session-meta .mono{font-size:11px;color:var(--fg-muted)}
.mock-session-title{font-weight:600;font-size:15px;margin-top:4px;letter-spacing:-.02em}
.mock-session-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn-danger{
  padding:10px 16px;border-radius:var(--r-sm);
  border:1px solid #e8c4c4;
  background:var(--surface);
  color:var(--red);
  font-weight:600;font-size:13px;
  transition:background .15s;
}
.btn-danger:hover{background:var(--red-soft)}
.mock-done-btn{
  width:100%;text-align:left;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--r);
  padding:14px 16px;
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  box-shadow:var(--shadow-sm);
  cursor:pointer;
  transition:transform .15s,box-shadow .15s,border-color .15s;
}
.mock-done-btn:hover{
  transform:translateY(-2px);
  box-shadow:var(--shadow-md);
  border-color:rgba(194,86,58,.25);
}

/* —— Review —— */
.review-block{
  padding-bottom:22px;
  margin-bottom:22px;
  border-bottom:1px solid var(--border);
}
.review-block:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.review-solution-label{font-size:12px;font-weight:700;color:var(--fg-muted);text-transform:uppercase;letter-spacing:.05em;margin:4px 0 10px}

@media (max-width:520px){
  .app-shell{padding:16px 14px 28px}
  .topic-grid{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>

<div id="root"></div>
<script type="text/babel">
const {useState,useCallback,useMemo,useEffect}=React;
const FILLS={accent:{s:'#c96442',f:'#f5e6df',t:'#c96442'},green:{s:'#2d6a4f',f:'#d1fae5',t:'#2d6a4f'},blue:{s:'#1d4e89',f:'#dbeafe',t:'#1d4e89'},purple:{s:'#5b4a9e',f:'#ede9fe',t:'#5b4a9e'},amber:{s:'#92400e',f:'#fef3c7',t:'#92400e'},red:{s:'#c0392b',f:'#fee2e2',t:'#c0392b'},fg:{s:'#3d3929',f:'#f0efe9',t:'#3d3929'}};
const gc=c=>FILLS[c]||FILLS.accent;

/* SVG primitives */
const Nm=({x,y,w,label,step,show})=>{if(show!==undefined&&step<show)return null;return<g className="fi"style={{animationDelay:show?show*.08+'s':'0s'}}><rect x={x-18}y={y-14}width={36}height={28}rx={4}fill="#dbeafe"stroke="#1d4e89"strokeWidth={1.5}/><text x={x}y={y+4}textAnchor="middle"fontSize={11}fill="#1d4e89"fontWeight={600}>{w||'N'}</text>{label&&<text x={x}y={y-20}textAnchor="middle"fontSize={9}fill="#83827d"fontWeight={500}>{label}</text>}</g>};
const Pm=({x,y,w,label,step,show})=>{if(show!==undefined&&step<show)return null;return<g className="fi"style={{animationDelay:show?show*.08+'s':'0s'}}><rect x={x-18}y={y-14}width={36}height={28}rx={4}fill="#fef3c7"stroke="#92400e"strokeWidth={1.5}/><circle cx={x-22}cy={y}r={4}fill="none"stroke="#92400e"strokeWidth={1.5}/><text x={x}y={y+4}textAnchor="middle"fontSize={11}fill="#92400e"fontWeight={600}>{w||'P'}</text>{label&&<text x={x}y={y-20}textAnchor="middle"fontSize={9}fill="#83827d"fontWeight={500}>{label}</text>}</g>};
const VD=({x,y})=><g className="fi"><line x1={x}y1={y}x2={x}y2={y+10}stroke="#c0392b"strokeWidth={1.5}/><line x1={x-12}y1={y}x2={x+12}y2={y}stroke="#c0392b"strokeWidth={2}/><text x={x}y={y-5}textAnchor="middle"fontSize={9}fill="#c0392b"fontWeight={600}>VDD</text></g>;
const GD=({x,y})=><g className="fi"><line x1={x}y1={y}x2={x}y2={y-10}stroke="#2d6a4f"strokeWidth={1.5}/><line x1={x-10}y1={y}x2={x+10}y2={y}stroke="#2d6a4f"strokeWidth={2}/><line x1={x-6}y1={y+4}x2={x+6}y2={y+4}stroke="#2d6a4f"strokeWidth={1.5}/><line x1={x-3}y1={y+8}x2={x+3}y2={y+8}stroke="#2d6a4f"strokeWidth={1}/></g>;
const B=({x,y,w,h,theme,text:t,step,show,fontSize:fs})=>{if(show!==undefined&&step<show)return null;const c=gc(theme||'accent'),bw=w||120,bh=h||32,lines=t?t.split('\n'):[],lh=(fs||11)+4,sy=y+bh/2-((lines.length-1)*lh)/2+4;return<g className="fi2"style={{animationDelay:show?show*.1+'s':'0s'}}><rect x={x}y={y}width={bw}height={bh}rx={6}fill={c.f}stroke={c.s}strokeWidth={1.5}strokeDasharray="4 2"/>{lines.map((l,i)=><text key={i}x={x+bw/2}y={sy+i*lh}textAnchor="middle"fontSize={fs||11}fill={c.t}fontWeight={600}>{l}</text>)}</g>};
const Gx=({x,y,w,h,label,sub,step,show,theme})=>{if(show!==undefined&&step<show)return null;const c=gc(theme||'fg');return<g className="fi"style={{animationDelay:show?show*.08+'s':'0s'}}><rect x={x}y={y}width={w||60}height={h||36}rx={5}fill="#fff"stroke={c.s}strokeWidth={1.5}/><text x={x+(w||60)/2}y={y+(h||36)/2+(sub?-1:4)}textAnchor="middle"fontSize={11}fill={c.t}fontWeight={600}>{label}</text>{sub&&<text x={x+(w||60)/2}y={y+(h||36)/2+12}textAnchor="middle"fontSize={9}fill="#83827d">{sub}</text>}</g>};

const MOCK_STORAGE_KEY = 'vlsi-prep-mock-exams';
const MOCK_MAX_COMPLETED = 20;
const MOCK_EXAM_QUESTION_COUNT = Math.min(10, TOPICS.reduce((a, t) => a + t.problems.length, 0));
const MOCK_DIAG_REVIEW_STEP = 50;

const trimMockSessions = (list) => {
  const inProg = list.filter((s) => s.status === 'in_progress');
  const done = list
    .filter((s) => s.status === 'completed')
    .sort((a, b) => (b.completedAt || 0) - (a.completedAt || 0))
    .slice(0, MOCK_MAX_COMPLETED);
  return [...inProg, ...done];
};

const loadMockSessions = () => {
  try {
    const v = JSON.parse(localStorage.getItem(MOCK_STORAGE_KEY) || '[]');
    return Array.isArray(v) ? trimMockSessions(v) : [];
  } catch {
    return [];
  }
};

const persistMockSessions = (list) => {
  const trimmed = trimMockSessions(list);
  try {
    localStorage.setItem(MOCK_STORAGE_KEY, JSON.stringify(trimmed));
  } catch {}
  return trimmed;
};

const flatProblemPool = () => {
  const r = [];
  for (const topic of TOPICS) {
    topic.problems.forEach((_, probIndex) => {
      r.push({ topicId: topic.id, probIndex });
    });
  }
  return r;
};

const shuffleArr = (a) => {
  const arr = a.slice();
  for (let i = arr.length - 1; i > 0; i--) {
    const j = (Math.random() * (i + 1)) | 0;
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
};

const newMockSession = (n) => {
  const pool = shuffleArr(flatProblemPool());
  const items = pool.slice(0, Math.min(n, pool.length)).map(({ topicId, probIndex }) => ({ topicId, probIndex }));
  return {
    id:
      typeof crypto !== 'undefined' && crypto.randomUUID
        ? crypto.randomUUID()
        : `${Date.now()}-${Math.random().toString(36).slice(2, 9)}`,
    createdAt: Date.now(),
    completedAt: null,
    status: 'in_progress',
    currentIndex: 0,
    items,
  };
};

const resolveProblemRef = (topicId, probIndex) => {
  const topic = TOPICS.find((t) => t.id === topicId);
  if (!topic) return null;
  const prob = topic.problems[probIndex];
  if (!prob) return null;
  return { topic, prob };
};

const fmtMockDate = (ts) => {
  if (!ts) return '';
  try {
    return new Date(ts).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
  } catch {
    return String(ts);
  }
};

  if(!item||!ref)return<div className="fi"><BackBtn onClick={onBackHub} label="Mock exams"/><p className="mock-empty" style={{color:'var(--red)',marginTop:12}}>This exam references content that is no longer in the app.</p></div>;
  const{topic,prob}=ref,Dia=prob.diagram.Component;
  return<div className="fi" key={session.id+'-'+idx}><BackBtn onClick={onBackHub} label="Mock exams"/><div className="progress-head" style={{marginTop:8}}><div className="progress-title">Mock exam</div><div className="progress-count mono">{idx+1}/{total}</div></div><PBar cur={idx+1} tot={total}/><div className="problem-title">{prob.title}</div><div className="preview-meta mono" style={{marginBottom:10}}>{topic.title} {'\u00B7'} Problem {idx+1}/{total}</div><div className="stats-row" style={{marginBottom:12}}><Chip accent>{prob.source}</Chip><Chip>{prob.diagramType}</Chip></div><div className="question-panel">{prob.question}</div><div className="diagram-panel" style={{marginBottom:16}}><Dia step={0}/></div><div className="action-row" style={{justifyContent:'space-between',alignItems:'center'}}><NavBtn label="Prev" muted onClick={()=>onSetIndex(Math.max(0,idx-1))} disabled={idx===0}/><div className="action-row">{!isLast&&<NavBtn label="Next" onClick={()=>onSetIndex(Math.min(total-1,idx+1))} accent/>}{isLast&&<NavBtn label="Submit exam" onClick={onSubmit} success/>}</div></div></div>;
};

const MockExamReview=({session,onBackHub})=>{
  if(session.status!=='completed')return<div className="fi"><BackBtn onClick={onBackHub} label="Mock exams"/><p className="mock-empty" style={{marginTop:12}}>Finish an exam to unlock solutions.</p></div>;
  return<div className="fi"><BackBtn onClick={onBackHub} label="Mock exams"/><div className="mock-page-title" style={{fontSize:22}}>Solutions</div><div className="preview-meta mono" style={{marginBottom:18}}>{fmtMockDate(session.completedAt)} {'\u00B7'} {session.items.length} problems</div><div className="mock-row-list" style={{gap:0}}>{session.items.map((item,globalIdx)=>{const r=resolveProblemRef(item.topicId,item.probIndex);if(!r)return<div key={globalIdx} className="review-block mock-empty" style={{color:'var(--red)'}}>Problem unavailable</div>;const{topic,prob}=r,Dia=prob.diagram.Component;return<div key={globalIdx} className="review-block"><div className="problem-title" style={{fontSize:17}}>{prob.title}</div><div className="preview-meta mono" style={{marginBottom:10}}>{topic.title} {'\u00B7'} {globalIdx+1}/{session.items.length}</div><div className="stats-row" style={{marginBottom:10}}><Chip accent>{prob.source}</Chip><Chip>{prob.diagramType}</Chip></div><div className="question-panel">{prob.question}</div><div className="diagram-panel"><Dia step={MOCK_DIAG_REVIEW_STEP}/></div><div className="review-solution-label">Solution steps</div><div className="step-stack" style={{marginBottom:0}}>{prob.steps.map((step,i)=><StepCard key={i} n={i+1} text={step.text} src={step.source} vis/>)}</div></div>;})}</div></div>;
};

const App=()=>{const[view,setView]=useState('home'),[topicId,setTopicId]=useState(null),[topicMode,setTopicMode]=useState('learn'),[probIdx,setProbIdx]=useState(0),[mockSessions,setMockSessions]=useState([]),[activeMockId,setActiveMockId]=useState(null);const topic=useMemo(()=>TOPICS.find(t=>t.id===topicId),[topicId]);const activeMock=useMemo(()=>mockSessions.find(s=>s.id===activeMockId)||null,[mockSessions,activeMockId]);useEffect(()=>{setMockSessions(loadMockSessions());},[]);const applyMockSessions=useCallback((next)=>{setMockSessions(prev=>persistMockSessions(typeof next==='function'?next(prev):next));},[]);const goHome=useCallback(()=>{setView('home');setTopicId(null);setTopicMode('learn');setProbIdx(0);setActiveMockId(null);},[]);const openTopic=useCallback(id=>{setTopicId(id);setTopicMode('learn');setProbIdx(0);setView('topic');},[]);const openProblem=useCallback(i=>{setProbIdx(i);setView('problem');},[]);const backToTopic=useCallback((mode='practice')=>{setTopicMode(mode);setView('topic');},[]);const openMockHub=useCallback(()=>{setMockSessions(loadMockSessions());setView('mockHub');setActiveMockId(null);},[]);const startNewMock=useCallback(()=>{if(MOCK_EXAM_QUESTION_COUNT<1)return;const s=newMockSession(MOCK_EXAM_QUESTION_COUNT);applyMockSessions(prev=>[...prev,s]);setActiveMockId(s.id);setView('mockRun');},[applyMockSessions]);const continueMock=useCallback(sess=>{setActiveMockId(sess.id);setView('mockRun');},[]);const reviewMock=useCallback(sess=>{setActiveMockId(sess.id);setView('mockReview');},[]);const patchMock=useCallback((id,patch)=>{applyMockSessions(prev=>prev.map(x=>x.id===id?{...x,...patch}:x));},[applyMockSessions]);const submitMock=useCallback(()=>{if(!activeMockId)return;applyMockSessions(prev=>prev.map(x=>x.id===activeMockId?{...x,status:'completed',completedAt:Date.now()}:x));setView('mockReview');},[activeMockId,applyMockSessions]);const discardMock=useCallback(id=>{if(!confirm('Discard this mock exam? Progress will be lost.'))return;applyMockSessions(prev=>prev.filter(x=>x.id!==id));if(activeMockId===id){setActiveMockId(null);setView('mockHub');}},[activeMockId,applyMockSessions]);const backMockHub=useCallback(()=>{setMockSessions(loadMockSessions());setActiveMockId(null);setView('mockHub');},[]);let content;if(view==='home')content=<Home onSelect={openTopic} onOpenMock={openMockHub}/>;else if(view==='mockHub')content=<MockExamHub sessions={mockSessions} examSize={MOCK_EXAM_QUESTION_COUNT} onBack={goHome} onGenerate={startNewMock} onContinue={continueMock} onReview={reviewMock} onDiscard={discardMock}/>;else if(view==='mockRun'&&activeMock)content=<MockExamRunner session={activeMock} onBackHub={backMockHub} onSetIndex={i=>patchMock(activeMock.id,{currentIndex:i})} onSubmit={submitMock}/>;else if(view==='mockReview'&&activeMock)content=<MockExamReview session={activeMock} onBackHub={backMockHub}/>;else if(view==='topic'&&topic)content=<TopicView topic={topic} mode={topicMode} onModeChange={setTopicMode} onBack={goHome} onStartLearn={()=>setView('learn')} onSelectProblem={openProblem}/>;else if(view==='learn'&&topic)content=<LearnView topic={topic} onBack={()=>backToTopic('learn')} onJumpToPractice={()=>backToTopic('practice')}/>;else if(view==='problem'&&topic)content=<ProblemView topic={topic} probIdx={probIdx} totalProbs={topic.problems.length} onNext={()=>setProbIdx(i=>i+1)} onPrev={()=>setProbIdx(i=>i-1)} onBack={()=>backToTopic('practice')}/>;else content=<Home onSelect={openTopic} onOpenMock={openMockHub}/>;return<div className="app-shell">{content}</div>};
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
